# nginx.conf (Kinsta App Hosting + Symfony 3.4)
daemon off;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr info;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;   # <— corrige /app/mime.types
  default_type  application/octet-stream;
  access_log    /dev/stdout;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 15;

  gzip on;
  gzip_types text/css application/javascript application/json application/xml text/plain;

  server {
    listen 8080;             # Kinsta App Hosting écoute sur 8080
    server_name localhost;

    root  /app/web;          # Symfony 3.4: dossier public = web/
    index app.php;

    # Fichiers statiques (cache long)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|woff2?|ttf|eot)$ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    # Routeur Symfony
    location / {
      try_files $uri /app.php$is_args$args;
    }

    # Front controller
    location ~ ^/app\.php(/|$) {
      fastcgi_pass 127.0.0.1:9000;    # php-fpm écoute généralement ici en App Hosting
      fastcgi_split_path_info ^(.+\.php)(/.*)$;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param HTTPS $https if_not_empty;
      internal;
    }

    # Bloque tout autre .php direct
    location ~ \.php$ { return 404; }
  }
}
