# /app/nginx.conf
daemon off;
worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr info;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;   # <— corrige /app/mime.types
  default_type  application/octet-stream;
  access_log    /dev/stdout;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 15;

  gzip on;
  gzip_types text/css application/javascript application/json application/xml text/plain;

  server {
    listen 8080;              # Kinsta route vers $PORT (8080 par défaut)
    server_name localhost;

    root  /app/web;           # Symfony 3.4 => dossier public = web/
    index app.php;

    # (Optionnel) client_max_body_size 50m;

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|woff2?|ttf|eot)$ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    location / { try_files $uri /app.php$is_args$args; }

    location ~ ^/app\.php(/|$) {
      fastcgi_pass 127.0.0.1:9000;   # php-fpm lancé par le provider PHP
      fastcgi_split_path_info ^(.+\.php)(/.*)$;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param HTTPS $https if_not_empty;
      internal;
    }

    location ~ \.php$ { return 404; }
  }
}
